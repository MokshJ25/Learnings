<!DOCTYPE html> <!--This is the declaration and tells the browser that it is a html type document-->

<html lang="en"> <!--Opening tab of html document and it uses "lang" attrinute-->

        <body> <!--What we can see on the Web page. Majority of code lies here(obviously)-->

            <h1>Learn</h1> <!--This will create a heading with the text "Learn", inside the body-->

        </body> 
    </head>
</html>
