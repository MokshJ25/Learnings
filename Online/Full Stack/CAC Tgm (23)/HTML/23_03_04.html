<!-- Use of ul,ol,dl,li,dt,dd tags -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>23_03_04</title>
</head>
<body>
    <ul>
        <li>Mango</li>
        <li>Apple</li>
        <li>Grapes</li>
    </ul>
    <!-- we can also create this list bt typinf "ui>li*3" -->

    <ol>
        <li>Ant</li>
        <li>Cat</li>
        <li>Elephant</li>
    </ol>

    <dl>
        <dt>HTML</dt>
        <dd>Hyper Text Markup Language</dd>

        <dt>CSS</dt>
        <dd>Cascading Style Sheet</dd>

        <dt>JS</dt>
        <dd>JavaScript</dd>
    </dl>
</body>
</html>
